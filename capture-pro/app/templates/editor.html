{% extends "base_modern.html" %}
{% set active = "editor" %}
{% block title %}Editor - AndikaToolsV1{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.min.js"></script>
<style>
.editor-layout { display:grid; grid-template-columns:280px 1fr; gap:16px; min-height:calc(100vh - 130px); }
.editor-sidebar { background:var(--bg-glass); backdrop-filter:blur(20px); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); display:flex; flex-direction:column; overflow:hidden; }
.editor-sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border-subtle); display:flex; justify-content:space-between; align-items:center; }
.editor-sidebar-header h3 { margin:0; font-size:14px; }
.editor-search { padding:10px 12px; border-bottom:1px solid var(--border-subtle); }
.editor-search input { width:100%; padding:8px 10px; background:var(--bg-secondary); border:1px solid var(--border-subtle); color:var(--text-primary); border-radius:8px; font-size:12px; box-sizing:border-box; }
.file-tree { flex:1; overflow-y:auto; padding:8px 6px; }
.file-item { padding:6px 12px; font-size:12px; cursor:pointer; color:var(--text-muted); display:flex; align-items:center; gap:6px; font-family:monospace; border-radius:6px; margin-bottom:2px; transition:var(--transition); }
.file-item:hover { background:var(--bg-tertiary); color:var(--text-primary); }
.file-item.active { background:rgba(99,102,241,0.15); color:var(--accent-primary); border-left:3px solid var(--accent-primary); }
.editor-main { display:flex; flex-direction:column; gap:12px; overflow:hidden; }
.editor-toolbar { background:var(--bg-glass); backdrop-filter:blur(20px); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:10px 14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.editor-filename { font-family:monospace; font-size:13px; color:var(--accent-primary); margin-right:auto; font-weight:500; }
.editor-container { flex:1; background:#0a0e1a; border:1px solid var(--border-subtle); border-radius:var(--radius-lg); overflow:hidden; min-height:0; }
#editor { height:100%; font-size:14px; }
.editor-terminal { background:var(--bg-glass); backdrop-filter:blur(20px); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); overflow:hidden; max-height:200px; display:none; }
.editor-terminal.active { display:block; }
.terminal-output { padding:12px 16px; font-family:monospace; font-size:12px; max-height:140px; overflow-y:auto; color:var(--text-secondary); }
.terminal-line { margin:2px 0; }
.terminal-line.success { color:#10b981; }
.terminal-line.error { color:#ef4444; }
.terminal-line.info { color:#6366f1; }
.terminal-input { display:flex; gap:6px; padding:8px 12px; background:rgba(0,0,0,0.3); border-top:1px solid var(--border-subtle); }
.terminal-input input { flex:1; padding:8px 12px; background:var(--bg-primary); border:1px solid var(--border-subtle); color:#10b981; border-radius:8px; font-family:monospace; font-size:12px; box-sizing:border-box; }

/* === RESPONSIVE EDITOR === */
@media (max-width: 900px) {
  .editor-layout {
    grid-template-columns: 1fr;
    min-height: auto;
    gap: 12px;
  }
  .editor-sidebar {
    max-height: 250px;
  }
  .editor-main {
    min-height: 500px;
  }
  .editor-toolbar {
    padding: 8px 10px;
    gap: 6px;
  }
  .editor-filename {
    width: 100%;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .editor-toolbar .btn {
    padding: 6px 10px;
    font-size: 11px;
  }
  #editor {
    font-size: 12px;
    min-height: 400px;
  }
}

</style>
{% endblock %}
{% block content %}
<div class="topbar" style="margin-bottom:16px">
  <div class="topbar-title"><h1>💻 Code Editor</h1><p>Edit file project dari browser</p></div>
</div>

<div class="editor-layout">
  <div class="editor-sidebar">
    <div class="editor-sidebar-header"><h3>📁 Files</h3><button class="btn" onclick="loadFiles()" style="padding:4px 10px;font-size:11px">🔄</button></div>
    <div class="editor-search"><input type="text" id="searchInput" placeholder="🔍 Cari file..."></div>
    <div class="file-tree" id="fileTree"></div>
  </div>
  <div class="editor-main">
    <div class="editor-toolbar">
      <span class="editor-filename" id="currentFile">Tidak ada file</span>
      <button class="btn btn-primary" onclick="saveFile()" id="btnSave" disabled>💾 Save</button>
      <button class="btn" onclick="restartServer()" style="background:#f59e0b;color:#0f172a">🔄 Restart</button>
      <button class="btn" onclick="toggleTerminal()">⌨️ Terminal</button>
      <button class="btn btn-red" onclick="deleteFile()" id="btnDelete" disabled>🗑️</button>
    </div>
    <div class="editor-container"><div id="editor"></div></div>
    <div class="editor-terminal" id="terminal">
      <div class="terminal-output" id="terminalOutput"></div>
      <div class="terminal-input">
        <input type="text" id="cmdInput" placeholder="ls, cat file.py, python run.py..." onkeydown="if(event.key==='Enter')runCmd()">
        <button class="btn btn-primary" onclick="runCmd()">▶ Run</button>
      </div>
    </div>
  </div>
</div>

<script>

// === Safe toast (fallback ke alert kalau Swal error) ===
function safeToast(icon, title) {
  if (typeof Swal !== "undefined") {
    Swal.fire({
      toast: true, position: "top-end", icon: icon, title: title,
      timer: 1500, showConfirmButton: false,
      background: "#131829", color: "#f8fafc"
    });
  } else {
    console.log("[toast " + icon + "] " + title);
    // Fallback: alert cuma kalau error
    if (icon === "error") alert("Error: " + title);
  }
}

var editor = ace.edit("editor");
editor.setTheme("ace/theme/monokai");
editor.session.setMode("ace/mode/python");
editor.setOptions({ fontSize: "14px", showPrintMargin: false, wrap: true });

var currentPath = null;
var MODES = { py:"python", html:"html", css:"css", js:"javascript", json:"json", txt:"text", md:"markdown", sh:"sh", xml:"xml", yml:"yaml", yaml:"yaml", sql:"sql", ini:"ini", cfg:"ini", env:"text", example:"text" };
var ICONS = { py:"🐍", html:"🌐", css:"🎨", js:"📜", json:"📋", txt:"📄", md:"📝", sh:"⚙️", xml:"📰", env:"🔒" };

function loadFiles() {
  fetch("/api/editor/files").then(r => r.json()).then(d => {
    if (!d.ok) return;
    var html = "";
    d.files.forEach(f => {
      if (!f.editable) return;
      var ext = f.ext.replace(".", "");
      var icon = ICONS[ext] || "📄";
      html += '<div class="file-item" data-path="' + f.path + '"><span>' + icon + '</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + f.path + '</span></div>';
    });
    document.getElementById("fileTree").innerHTML = html;
    document.querySelectorAll(".file-item").forEach(el => {
      el.addEventListener("click", () => openFile(el.dataset.path));
    });
  });
}

function openFile(path) {
  fetch("/api/editor/read?path=" + encodeURIComponent(path)).then(r => r.json()).then(d => {
    if (!d.ok) return Swal.fire("Error", d.msg, "error");
    currentPath = path;
    editor.session.setMode("ace/mode/" + (MODES[d.ext] || "text"));
    editor.setValue(d.content, -1);
    document.getElementById("currentFile").textContent = path;
    document.getElementById("btnSave").disabled = false;
    document.getElementById("btnDelete").disabled = false;
    document.querySelectorAll(".file-item").forEach(x => x.classList.toggle("active", x.dataset.path === path));
  });
}

function saveFile() {
  if (!currentPath) return;
  // Cek apakah ada file yang dibuka
  if (!currentPath) { alert("Belum ada file dibuka. Klik file di sidebar dulu."); return; }
  
  // Show loading (kalau Swal ada)
  if (typeof Swal !== "undefined") {
    Swal.fire({ title: "Menyimpan...", didOpen: () => Swal.showLoading(), allowOutsideClick: false, background: "#131829", color: "#f8fafc" });
  }
  
  fetch("/api/editor/write", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: currentPath, content: editor.getValue() }),
  }).then(r => r.json()).then(d => {
    if (typeof Swal !== "undefined") Swal.close();
    console.log("[save]", d);
    if (d.ok) {
      safeToast("success", "✅ Tersimpan: " + (d.backup ? "(backup dibuat)" : "OK"));
      // Update judul dengan tanda tersimpan
      document.title = "✓ " + currentPath;
    } else {
      safeToast("error", d.msg || "Gagal menyimpan");
    }
  }).catch(e => {
    if (typeof Swal !== "undefined") Swal.close();
    console.error("[save error]", e);
    alert("Error: " + e.message);
  });
}

function deleteFile() {
  if (!currentPath) return;
  Swal.fire({ title: "Hapus file?", text: currentPath, icon: "warning", showCancelButton: true, confirmButtonText: "Hapus", confirmButtonColor: "#ef4444", background: "#131829", color: "#f8fafc" }).then(r => {
    if (!r.isConfirmed) return;
    fetch("/api/editor/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: currentPath }) })
      .then(r => r.json()).then(d => {
        if (d.ok) {
          currentPath = null;
          editor.setValue("", -1);
          document.getElementById("currentFile").textContent = "Tidak ada file";
          document.getElementById("btnSave").disabled = true;
          document.getElementById("btnDelete").disabled = true;
          loadFiles();
        }
      });
  });
}

function restartServer() {
  Swal.fire({ title: "Restart server?", text: "Halaman reload otomatis 3 detik", icon: "warning", showCancelButton: true, confirmButtonText: "Restart", confirmButtonColor: "#f59e0b", background: "#131829", color: "#f8fafc" }).then(r => {
    if (!r.isConfirmed) return;
    fetch("/api/editor/restart", { method: "POST" }).then(r => r.json()).then(d => {
      Swal.fire({ icon: "success", title: d.msg || "Restarting...", timer: 2000, showConfirmButton: false, background: "#131829", color: "#f8fafc" });
      setTimeout(() => location.reload(), 3500);
    });
  });
}

function toggleTerminal() { document.getElementById("terminal").classList.toggle("active"); }

function runCmd() {
  var cmd = document.getElementById("cmdInput").value.trim();
  if (!cmd) return;
  addTerminal("$ " + cmd, "info");
  document.getElementById("cmdInput").value = "";
  fetch("/api/editor/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cmd: cmd }) })
    .then(r => r.json()).then(d => {
      if (d.stdout) addTerminal(d.stdout, "success");
      if (d.stderr) addTerminal(d.stderr, "error");
      if (!d.ok) addTerminal(d.msg || "Error", "error");
    });
}

function addTerminal(text, cls) {
  var out = document.getElementById("terminalOutput");
  var div = document.createElement("div");
  div.className = "terminal-line " + (cls || "");
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (currentPath) saveFile(); }
});

loadFiles();
</script>
{% endblock %}
